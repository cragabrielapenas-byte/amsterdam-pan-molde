<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pan de molde · Amsterdam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lora:ital,wght@1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5EDDF;--surface:#FFFFFF;--ink:#0E1C3A;--muted:#5B6478;
  --primary:#0E1C3A;--primary-2:#152A52;--primary-3:#1F3A6B;
  --accent:#E9743A;--accent-2:#F28F57;
  --info-c:#9CCBEA;--success-c:#7D8340;--warning-c:#CDA85E;--danger-c:#C8473B;
  --line:rgba(14,28,58,.12);
  --font-title:'Poppins',system-ui,sans-serif;--font-accent:'Lora',Georgia,serif;--font-body:'Inter',system-ui,sans-serif;
  --r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;--shadow:0 10px 30px rgba(14,28,58,.07);
  /* alias usados por la app */
  --card:var(--surface);--mut:var(--muted);--soft:#EFE5D3;--pri:var(--primary);--pri2:var(--accent);--prisoft:rgba(233,116,58,.14);
  --ok:#5E6330;--okbg:#ECEEDB;--warn:#8A6516;--warnbg:#F7EBCF;--crit:#B23A2F;--critbg:#F8E1DD;--info:#24597E;--infobg:#E3F0F9;
  --r:var(--r-lg);--sh:var(--shadow);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
a{color:var(--primary-3);font-weight:600}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;overflow:hidden}
header::before{content:'';position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(156,203,234,.28),transparent 65%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-title);font-weight:700;font-size:18px;letter-spacing:-.01em;position:relative}
.brand .logo{width:38px;height:38px;border-radius:12px;background:radial-gradient(circle at 35% 30%,#F6B982,var(--accent) 60%,#C85A26);display:grid;place-items:center;font-size:19px}
.brand em{font-family:var(--font-accent);font-style:italic;font-weight:500;color:var(--accent-2)}
.brand small{display:block;font-family:var(--font-title);font-weight:500;opacity:.7;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--info-c)}
.hsp{flex:1}
.chip-user{white-space:nowrap;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:var(--r-pill);padding:8px 14px;font-family:var(--font-title);font-weight:600;font-size:13px;cursor:pointer;position:relative}
.chip-user small{opacity:.65;font-weight:500;margin-left:4px}
.badge-mode{font-family:var(--font-title);font-size:10.5px;font-weight:700;letter-spacing:.16em;padding:5px 10px;border-radius:var(--r-pill);background:var(--warning-c);color:var(--primary);position:relative}
.badge-mode.live{background:var(--success-c);color:#fff}
nav{position:sticky;top:62px;z-index:19;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:10px 16px;font-family:var(--font-title);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink);min-height:44px}
nav button.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{max-width:1180px;margin:0 auto;padding:28px 18px 90px}
.eyebrow{font-family:var(--font-title);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.28em;color:var(--primary-3);margin-bottom:8px}
.eyebrow span{color:var(--accent);margin-right:10px;font-weight:700}
h1{font-family:var(--font-title);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-bottom:8px}
h1 em,.empty h3 em{font-family:var(--font-accent);font-style:italic;font-weight:500;color:var(--accent)}
.sub{color:var(--muted);margin-bottom:24px;font-size:16px;max-width:720px}
h2{font-family:var(--font-title);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:32px 0 14px}
h3{font-family:var(--font-title)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px}
.card > b:first-child{font-family:var(--font-title);font-weight:700;font-size:17px}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-family:var(--font-title);font-size:11.5px;font-weight:500;color:var(--primary-3);text-transform:uppercase;letter-spacing:.2em}
.kpi .val{font-family:var(--font-title);font-size:44px;font-weight:700;margin:6px 0 2px;line-height:1.05;letter-spacing:-.02em}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .det{font-size:14px;color:var(--muted)}
.kpi.warn{box-shadow:inset 0 5px 0 var(--warning-c),var(--shadow)} .kpi.crit{box-shadow:inset 0 5px 0 var(--danger-c),var(--shadow)} .kpi.okk{box-shadow:inset 0 5px 0 var(--success-c),var(--shadow)}
.kpi.dark{background:var(--primary);color:#fff}.kpi.dark input,.kpi.dark select{color:var(--ink)}.kpi.dark .lbl{color:var(--info-c)}.kpi.dark .det,.kpi.dark .val small{color:rgba(255,255,255,.7)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:var(--r-pill);padding:14px 26px;font-family:var(--font-title);font-weight:600;cursor:pointer;background:var(--accent);color:#fff;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:48px;transition:background .15s}
.btn:hover{background:#D9662E}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn.sec:hover{background:rgba(14,28,58,.05)}
.btn.ghost{background:transparent;color:var(--primary-3);padding:8px 10px;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.btn.danger{background:var(--danger-c)}
.btn.dark{background:var(--primary)}
.btn.sm{padding:9px 16px;font-size:13px;min-height:38px}
.btn.big{padding:18px 26px;font-size:17px;width:100%;min-height:58px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.quick .btn{padding:18px 10px;flex-direction:column;gap:6px;background:var(--surface);color:var(--ink);border-radius:var(--r-md);box-shadow:var(--shadow);min-height:96px}
.quick .btn:hover{background:#fff;box-shadow:inset 0 -4px 0 var(--accent),var(--shadow)}
.quick .btn span{font-size:24px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:16px 0 6px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-md);padding:12px 14px;font-size:16px;min-height:50px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,116,58,.3)}
textarea{min-height:60px;resize:vertical}
.step{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:var(--r-pill);overflow:hidden;background:#fff;max-width:240px}
.step button{width:58px;border:0;background:transparent;font-size:24px;font-weight:600;cursor:pointer;color:var(--primary)}
.step button:active{background:var(--prisoft)}
.step input{border:0 !important;border-radius:0;text-align:center;font-family:var(--font-title);font-size:24px;font-weight:700;padding:8px 4px;min-width:0;min-height:54px;box-shadow:none !important;-moz-appearance:textfield}
.step:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,116,58,.3)}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.vrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vname{font-family:var(--font-title);font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.vmeta{font-size:14px;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-title);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-pill);background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.crit{background:var(--critbg);color:var(--crit)} .pill.info{background:var(--infobg);color:var(--info)}
.pill.dark{background:var(--primary);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-family:var(--font-title);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--primary-3);font-weight:500;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-family:var(--font-title);font-weight:600}
tr.anul td{color:#a7a9b3;text-decoration:line-through}
.tw{overflow-x:auto}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:var(--r-md);font-size:15px;background:var(--surface);box-shadow:var(--shadow);border-left:5px solid}
.alert.crit{border-color:var(--danger-c)} .alert.warn{border-color:var(--warning-c)} .alert.info{border-color:var(--info-c)} .alert.ok{border-color:var(--success-c)}
.lotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lote{background:var(--surface);border:2px solid transparent;border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px;cursor:pointer;text-align:left;position:relative;font-family:var(--font-body)}
.lote.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--prisoft)}
.lote.warn{border-color:var(--warning-c)} .lote.crit{border-color:var(--danger-c)}
.lote .ln{font-family:var(--font-title);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.lote .lv{font-size:14px;font-weight:600;margin:2px 0 8px;display:flex;gap:6px;align-items:center}
.lote .lq{font-size:14px}
.lote .lq b{font-family:var(--font-title);font-size:22px;font-weight:700}
.lote .tag{position:absolute;top:12px;right:12px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{flex:1 1 140px;border:2px solid var(--line);background:#fff;border-radius:var(--r-md);padding:14px 10px;font-family:var(--font-title);font-weight:600;cursor:pointer;text-align:center;min-height:64px}
.seg button small{display:block;font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.seg button.on{border-color:var(--accent);background:var(--prisoft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.muted{color:var(--muted)} .small{font-size:14px}
.sep{height:1px;background:var(--line);margin:16px 0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.filters label.f{margin-top:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--primary);color:#fff;padding:14px 22px;border-radius:var(--r-pill);font-family:var(--font-title);font-weight:600;z-index:100;transition:.25s;max-width:92vw;box-shadow:0 12px 34px rgba(14,28,58,.3)}
@media(max-width:600px){#toast{border-radius:16px;width:max-content;max-width:90vw;text-align:center;font-size:14px}.brand{white-space:nowrap;font-size:16px}.badge-mode{display:none}}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger-c)}
.modal-bg{position:fixed;inset:0;background:rgba(14,28,58,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:28px}
@media(min-width:700px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:var(--r-lg)}}
.modal h3{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.modal h3 em{font-family:var(--font-accent);font-style:italic;font-weight:500;color:var(--accent)}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:4px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-family:var(--font-title);font-weight:600}
canvas{max-height:280px}
.cfg-row{display:grid;grid-template-columns:1fr 110px 90px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cfg-row.m{grid-template-columns:1fr 90px auto}
.cfg-row.u{grid-template-columns:1fr 170px auto}
/* login */
.login{position:fixed;inset:0;z-index:40;background:var(--primary);color:#fff;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.login::before{content:'';position:fixed;left:-140px;bottom:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(246,185,130,.55),rgba(233,116,58,.25) 45%,transparent 70%);pointer-events:none}
.login::after{content:'';position:fixed;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(156,203,234,.3),transparent 65%);pointer-events:none}
.login-in{position:relative;width:100%;max-width:640px}
.login h1{font-size:44px;color:#fff}
.login h1 em{color:var(--accent-2)}
.login .eyebrow{color:var(--info-c)}
.login .sub{color:rgba(255,255,255,.72)}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ucard{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);color:#fff;border-radius:var(--r-md);padding:18px 14px;text-align:left;cursor:pointer;min-height:92px}
.ucard:hover{background:rgba(255,255,255,.12)}
.ucard b{display:block;font-family:var(--font-title);font-size:17px;font-weight:600;margin-top:8px}
.ucard small{font-family:var(--font-title);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--info-c)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--font-title);font-weight:700;color:#fff}
.pinbox{background:#fff;color:var(--ink);border-radius:var(--r-lg);padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.25);max-width:380px;margin:0 auto}
.pindots{display:flex;gap:14px;justify-content:center;margin:18px 0 22px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--primary-3)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:62px;border-radius:var(--r-md);border:0;background:#F3EEE5;font-family:var(--font-title);font-size:24px;font-weight:600;cursor:pointer;color:var(--primary)}
.keypad button:active{background:var(--prisoft)}
.keypad button.k2{font-size:14px;background:transparent}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.rolechip{font-family:var(--font-title);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:var(--r-pill)}
@media(max-width:600px){h1{font-size:30px}.login h1{font-size:34px}.kpi .val{font-size:36px}.cfg-row{grid-template-columns:1fr 80px 70px}.cfg-row .btn,.cfg-row .row{grid-column:1/-1}.cfg-row.u{grid-template-columns:1fr}.card{padding:20px}main{padding:22px 14px 90px}.brand small{display:none}}

/* ---- flujo v3 ---- */
.tarea{margin-bottom:8px;box-shadow:inset 0 5px 0 var(--accent),var(--shadow)}
.tarea h3{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.tarea .eyebrow span{font-size:15px}
.daychips{margin:6px 0 4px}.daychips button{font-size:14px}.daychips b{font-family:var(--font-title)}
.tl-rows{margin:6px 0 16px}
.tlote{border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:12px}
.tl-h{font-family:var(--font-title);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table.flujo th.stg,table.flujo td.stg{text-align:center}
table.flujo th .sn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:11px;margin-right:6px;letter-spacing:0}
table.flujo td{padding:8px 10px}
table.flujo tr.last td{border-bottom:2px solid rgba(14,28,58,.18)}
table.flujo tbody tr:last-child td{border-bottom:0}
table.flujo tr.hoy td{background:rgba(233,116,58,.05)}
.lotecell{border-right:1px solid var(--line);min-width:96px;vertical-align:top !important;padding-top:14px !important}
.lotecell .ln{font-family:var(--font-title);font-size:26px;font-weight:700;line-height:1}
.cbtn{display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;min-height:52px;justify-content:center;border-radius:var(--r-md);border:1.5px solid transparent;background:transparent;padding:6px 10px;font-family:var(--font-body)}
.cbtn.ed{cursor:pointer;border-color:var(--line);background:#fff}
.cbtn.ed:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,116,58,.18)}
.cbtn.ed:not(.lleno){border-style:dashed;border-color:rgba(233,116,58,.6)}
.cargar{color:var(--accent);font-family:var(--font-title);font-weight:600;font-size:14px}
.cv{font-family:var(--font-title);font-size:22px;font-weight:700;line-height:1.1;display:block}
td.stg .pill{margin-top:3px}
.leyenda{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){.flujo-card{padding:12px}.cbtn{min-width:64px;padding:6px}.cv{font-size:19px}table.flujo td{padding:6px 4px}.lotecell{min-width:64px}}
.mcards{display:none}
.mlote{padding:16px;margin-bottom:12px}.mlote.hoy{box-shadow:inset 0 5px 0 var(--accent),var(--shadow)}
.ml-h{font-family:var(--font-title);font-weight:600;margin-bottom:6px}.ml-h .ln{font-size:22px;font-weight:700;margin-right:4px}
.ml-v{padding:12px 0;border-top:1px solid var(--line)}
.ml-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.ml-steps .cbtn{min-width:0;width:100%;padding:6px 2px}.ml-steps .pill{font-size:9.5px;padding:3px 6px;letter-spacing:.04em}
.ml-l{font-family:var(--font-title);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary-3);margin-bottom:4px;white-space:nowrap}
.ml-l .sn{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;margin-right:3px}
@media(max-width:760px){.mcards{display:block}.flujo-card{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">🍞</div><div>Pan de <em>molde</em><small>Panificadora Amsterdam</small></div></div>
  <div class="hsp"></div>

<script>
/* =====================================================================
   PAN DE MOLDE · Flujo por lote — Panificadora Amsterdam
   Paso 1 Pedido (Encargado de pedido) → Paso 2 Producido (Encargado de producción)
   → Paso 3 Cortado y envasado (Encargado de sandwichería). Descarte = producido − cortado.
   ===================================================================== */
const SUPABASE_URL = 'https://lyzfmbiusuxsuyoowrdy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5emZtYml1c3V4c3V5b293cmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjU0MjAsImV4cCI6MjEwMDg0MTQyMH0.AYz5L8IExegZNhZ423IXmGJucY2bDJkWlpHZFuR8cFg';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
const dow = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DIAS3 = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fmtD = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '—';
const fmtDL = iso => iso ? DIAS3[dow(iso)] + ' ' + fmtD(iso) : '—';
const nf = n => (Math.round(n * 10) / 10).toLocaleString('es-UY');

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now());
const lunesDe = iso => addDays(iso, -((dow(iso) + 6) % 7));
const localDay = ts => { const d = new Date(ts); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const COLORS = ['#E9743A', '#1F3A6B', '#7D8340', '#CDA85E', '#5FA3CF', '#C8473B', '#8B5E9A', '#5B6478'];
const isNum = v => v !== null && v !== undefined && v !== '';

let S = { variedades: [], personas: [], config: {}, flujo: [] };
let VIEW = 'flujo', UI = {}, CHARTS = [];
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', err ? 4200 : 2400); }
function cfg(k) { const d = { dias_alerta: 2, umbral_desvio: 10, umbral_descarte: 5 }; const v = S.config[k]; return v === undefined || v === null || v === '' ? d[k] : Number(v); }
const vById = id => S.variedades.find(v => v.id === id) || { nombre: '¿?', orden: 99 };
const vColor = id => { const i = S.variedades.findIndex(v => v.id === id); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
const vDot = id => `<i class="dot" style="background:${vColor(id)}"></i>`;
const vCorto = id => vById(id).nombre.replace(/^Pan de s[aá]ndwich /i, '').replace(/^\w/, c => c.toUpperCase());
const vAct = () => S.variedades.filter(v => v.activo).sort((a, b) => a.orden - b.orden || a.nombre.localeCompare(b.nombre));

/* ---------- etapas ---------- */
const STAGES = [
  { k: 'pedido', n: 1, label: 'Pedido', who: 'Encargado de pedido', rol: 'despacho', icon: '📝', verbo: 'mandaste a hacer' },
  { k: 'producido', n: 2, label: 'Producido', who: 'Encargado de producción', rol: 'produccion', icon: '🔥', verbo: 'salieron del horno' },
  { k: 'cortado', n: 3, label: 'Cortado y envasado', who: 'Encargado de sandwichería', rol: 'sandwicheria', icon: '🔪', verbo: 'quedaron cortados y envasados' }
];

/* ---------- roles ----------
   Nota técnica: el rol "Encargado de pedido" se guarda con el valor 'despacho'
   (valor ya permitido por la tabla pm_personas, para no tener que modificarla). */
const ROLES = {
  admin:        { label: 'Administración', color: '#E9743A', desc: 'Carga y corrige cualquier paso. Gestiona usuarios y configuración.', edita: ['pedido', 'producido', 'cortado'], views: ['flujo', 'informes', 'usuarios', 'config'] },
  supervisor:   { label: 'Supervisión', color: '#1F3A6B', desc: 'Carga y corrige cualquier paso. Ve informes.', edita: ['pedido', 'producido', 'cortado'], views: ['flujo', 'informes'] },
  despacho:     { label: 'Encargado de pedido', color: '#5FA3CF', desc: 'Paso 1: carga cuántos moldes se mandan a hacer en cada lote.', edita: ['pedido'], views: ['flujo'] },
  produccion:   { label: 'Encargado de producción', color: '#7D8340', desc: 'Paso 2: carga cuántos moldes se produjeron al terminar la cocinada.', edita: ['producido'], views: ['flujo'] },
  sandwicheria: { label: 'Encargado de sandwichería', color: '#CDA85E', desc: 'Paso 3: carga cuántos moldes quedaron cortados y envasados.', edita: ['cortado'], views: ['flujo'] },
  consulta:     { label: 'Solo consulta', color: '#5B6478', desc: 'Ve el flujo y los informes. No carga nada.', edita: [], views: ['flujo', 'informes'] }
};
const ME = () => { const id = localStorage.getItem('pm_sess'); return S.personas.find(p => p.id === id && p.activo && ROLES[p.rol]) || null; };
const user = () => ME()?.nombre || '';
const rol = () => ROLES[ME()?.rol] || null;
const canView = v => !!rol() && rol().views.includes(v);
const esJefe = () => ['admin', 'supervisor'].includes(ME()?.rol);
// Un encargado puede cargar/corregir su paso mientras el paso siguiente esté vacío. Admin/supervisión siempre.
function canEdit(stageK, row, fecha) {
  if (!rol() || !rol().edita.includes(stageK)) return false;
  const f = row?.fecha || fecha;
  if (stageK !== 'pedido' && f && f > today()) return false;
  if (esJefe()) return true;
  const i = STAGES.findIndex(s => s.k === stageK), next = STAGES[i + 1];
  if (next && row && isNum(row[next.k])) return false;
  if (stageK === 'cortado' && (!row || !isNum(row.producido))) return false;
  return true;
}
async function hashPin(id, pin) {
  const txt = 'pm|' + id + '|' + pin;
  if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const c of txt) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return 'f' + h.toString(16);
}
function H(n, eb, t, acc) { return `<div class="eyebrow"><span>${String(n).padStart(2, '0')}</span>${eb}</div><h1>${t} <em>${acc}</em></h1>`; }

/* ---------- datos ---------- */
const LIVE = !!SUPABASE_KEY && !SUPABASE_KEY.startsWith('__');
let sb = null;
const TABLES = { variedades: 'pm_variedades', personas: 'pm_personas', flujo: 'pm_flujo' };
const DB = {
  async load() {
    if (LIVE) {
      const desde = addDays(today(), -400);
      const all = async (t, q) => { let out = [], from = 0; for (;;) { const r = await q(sb.from(t).select('*')).range(from, from + 999); if (r.error) throw r.error; out = out.concat(r.data); if (r.data.length < 1000) break; from += 1000; } return out; };
      const [v, p, c, f] = await Promise.all([all('pm_variedades', q => q.order('orden')), all('pm_personas', q => q.order('nombre')), all('pm_config', q => q), all('pm_flujo', q => q.gte('fecha', desde).order('fecha'))]);
      S = { variedades: v, personas: p, config: Object.fromEntries(c.map(x => [x.clave, x.valor])), flujo: f };
    } else {
      const raw = localStorage.getItem('pm3_demo');
      S = raw ? JSON.parse(raw) : demoBase();
      for (const p of S.personas) if (p.pin_demo && !p.pin_hash) { p.pin_hash = await hashPin(p.id, p.pin_demo); delete p.pin_demo; }
      demoSave();
    }
  },
  async ins(k, row) {
    row = { ...row };
    if (LIVE) { const r = await sb.from(TABLES[k]).insert(row).select().single(); if (r.error) throw r.error; S[k].push(r.data); return r.data; }
    row.id = row.id || uid(); row.created_at = new Date().toISOString();
    if (k === 'flujo' && S.flujo.some(x => x.fecha === row.fecha && x.variedad_id === row.variedad_id)) throw { code: '23505' };
    S[k].push(row); demoSave(); return row;
  },
  async upd(k, id, patch) {
    if (LIVE) { const r = await sb.from(TABLES[k]).update(patch).eq('id', id).select().single(); if (r.error) throw r.error; const i = S[k].findIndex(x => x.id === id); if (i >= 0) S[k][i] = r.data; return r.data; }
    const o = S[k].find(x => x.id === id); Object.assign(o, patch); demoSave(); return o;
  },
  async setCfg(clave, valor) { if (LIVE) { const r = await sb.from('pm_config').upsert({ clave, valor }); if (r.error) throw r.error; } S.config[clave] = valor; if (!LIVE) demoSave(); }
};
function demoSave() { if (!LIVE) localStorage.setItem('pm3_demo', JSON.stringify(S)); }
function demoBase() {
  return {
    variedades: [{ id: uid(), nombre: 'Pan de sándwich blanco', activo: true, orden: 1 }, { id: uid(), nombre: 'Pan de sándwich integral', activo: true, orden: 2 }],
    personas: [['Gabi', 'admin'], ['Encargado 1', 'despacho'], ['Encargado 2', 'produccion'], ['Encargado 3', 'sandwicheria'], ['Contadora', 'consulta']].map(([n, r]) => ({ id: uid(), nombre: n, rol: r, activo: true, pin_demo: '1234' })),
    config: { dias_alerta: 2, umbral_desvio: 10, umbral_descarte: 5 }, flujo: []
  };
}
async function safe(fn) {
  try { await fn(); } catch (e) {
    console.error(e);
    if (e?.code === '23505') { toast('Otro usuario cargó ese lote recién. Actualicé los datos, probá de nuevo.', true); await DB.load(); render(); }
    else toast('Error al guardar: ' + (e?.message || e), true);
  }
}

/* ---------- lógica del flujo ---------- */
const fila = (fecha, vid) => S.flujo.find(r => r.fecha === fecha && r.variedad_id === vid);
function info(r) {
  const o = { estado: 'vacio', nivel: '', espera: null, desv: null, desvPct: null, desc: null, descPct: null };
  if (!r) return o;
  if (isNum(r.pedido) && isNum(r.producido)) { o.desv = r.producido - r.pedido; o.desvPct = r.pedido ? pct(o.desv, r.pedido) : null; }
  if (isNum(r.producido) && isNum(r.cortado)) { o.desc = r.producido - r.cortado; o.descPct = r.producido ? pct(o.desc, r.producido) : null; }
  if (isNum(r.cortado)) { o.estado = 'cerrado'; o.espera = r.fecha_corte ? diffDays(r.fecha_corte, r.fecha) : null; }
  else if (isNum(r.producido)) { o.estado = 'enfriando'; o.espera = diffDays(today(), r.fecha); o.nivel = o.espera >= cfg('dias_alerta') + 1 ? 'crit' : o.espera >= cfg('dias_alerta') ? 'warn' : 'ok'; }
  else if (isNum(r.pedido)) o.estado = 'pedido';
  return o;
}
const desvNivel = p => p === null ? '' : Math.abs(p) > cfg('umbral_desvio') ? 'warn' : 'ok';
const descNivel = p => p === null ? '' : p > cfg('umbral_descarte') * 2 ? 'crit' : p > cfg('umbral_descarte') ? 'warn' : 'ok';
const signo = n => (n > 0 ? '+' : '') + nf(n);

async function guardarValor(fecha, vid, stageK, val) {
  const r = fila(fecha, vid), now = new Date().toISOString();
  if (dow(fecha) === 0) throw new Error('Los domingos no hay lote');
  if (stageK !== 'pedido' && val !== null && fecha > today()) throw new Error('No se puede cargar producción ni corte de un día que todavía no llegó');
  if (stageK === 'cortado') {
    if (!r || !isNum(r.producido)) throw new Error('Primero hay que cargar lo producido');
    if (val !== null && val > r.producido) throw new Error(`No puede haber más cortados (${val}) que producidos (${r.producido})`);
  }
  if (stageK === 'producido' && val !== null && r && isNum(r.cortado) && val < r.cortado) throw new Error(`Ya se cortaron ${r.cortado} moldes de este lote`);
  const patch = { [stageK]: val, [stageK + '_por']: val === null ? null : user(), [stageK + '_at']: val === null ? null : now };
  if (stageK === 'cortado') patch.fecha_corte = val === null ? null : (r.fecha_corte && r.cortado !== null ? r.fecha_corte : today());
  if (r) return DB.upd('flujo', r.id, patch);
  if (val === null) return;
  return DB.ins('flujo', { fecha, variedad_id: vid, lote: dow(fecha), ...patch });
}

/* ---------- navegación ---------- */
const NAV = [['flujo', '🍞 Flujo de lotes'], ['informes', '📈 Informes'], ['usuarios', '👥 Usuarios'], ['config', '⚙️ Configuración']];
const V = {}, AFTER = {};
function go(v, opts) { if (!canView(v)) v = 'flujo'; VIEW = v; UI = opts || {}; render(); window.scrollTo(0, 0); }
function render() {
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  if (!ME()) { $('#nav').innerHTML = ''; $('#view').innerHTML = ''; $('#userChip').style.display = 'none'; return renderLogin(); }
  $('#login').innerHTML = ''; $('#userChip').style.display = '';
  if (!canView(VIEW)) VIEW = 'flujo';
  const tabs = NAV.filter(([k]) => canView(k));
  $('#nav').style.display = tabs.length > 1 ? '' : 'none';
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button class="${k === VIEW ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#userChip').innerHTML = esc(user()) + '<small>· ' + rol().label + '</small>';
  $('#view').innerHTML = V[VIEW]();
  (AFTER[VIEW] || (() => {}))();
}

/* ---------- stepper ---------- */
function stepper(id, val) { return `<div class="step"><button type="button" onclick="stepBy('${id}',-1)">−</button><input type="number" inputmode="numeric" id="${id}" value="${val ?? ''}" min="0" placeholder="0"><button type="button" onclick="stepBy('${id}',1)">+</button></div>`; }
function stepBy(id, d) { const i = document.getElementById(id); i.value = Math.max(0, (parseInt(i.value) || 0) + d); i.dispatchEvent(new Event('input')); }
const num = id => { const el = document.getElementById(id); if (!el || el.value === '') return null; const n = parseInt(el.value); return isNaN(n) || n < 0 ? null : n; };

/* =====================================================================
   VISTA PRINCIPAL · FLUJO
   ===================================================================== */
V.flujo = () => {
  const t = today(), ws = UI.ws || lunesDe(t); UI.ws = ws;
  const dias = [0, 1, 2, 3, 4, 5].map(i => addDays(ws, i));
  const vs = vAct();
  const semana = S.flujo.filter(r => r.fecha >= ws && r.fecha <= addDays(ws, 5));
  const tot = k => semana.reduce((s, r) => s + (isNum(r[k]) ? r[k] : 0), 0);
  const conPed = semana.filter(r => isNum(r.pedido) && isNum(r.producido)), cerr = semana.filter(r => isNum(r.cortado));
  const cump = pct(conPed.reduce((s, r) => s + r.producido, 0), conPed.reduce((s, r) => s + r.pedido, 0));
  const descM = cerr.reduce((s, r) => s + (r.producido - r.cortado), 0), descP = pct(descM, cerr.reduce((s, r) => s + r.producido, 0));
  const pend = S.flujo.filter(r => isNum(r.producido) && !isNum(r.cortado));
  const pendM = pend.reduce((s, r) => s + r.producido, 0), viejos = pend.filter(r => info(r).nivel !== 'ok');
  const viejosAnt = pend.filter(r => r.fecha < ws);
  return `${H(1, 'Flujo de lotes', 'Cada lote,', 'paso a paso')}
  <div class="sub">Pedido → producido → cortado y envasado. Cada encargado completa su paso y los desvíos se calculan solos.</div>
  ${tarea()}
  <div class="grid g4" style="margin-top:8px">
    <div class="card kpi ${cump === null ? '' : desvNivel(cump - 100) === 'warn' ? 'warn' : 'okk'}"><div class="lbl">Cumplimiento producción</div><div class="val">${cump === null ? '—' : nf(cump) + '<small>%</small>'}</div><div class="det">${tot('producido')} producidos de ${tot('pedido')} pedidos (semana)</div></div>
    <div class="card kpi ${descNivel(descP) === 'crit' ? 'crit' : descNivel(descP) === 'warn' ? 'warn' : descP !== null ? 'okk' : ''}"><div class="lbl">Descarte</div><div class="val">${descP === null ? '—' : nf(descP) + '<small>%</small>'}</div><div class="det">${descM} moldes descartados en lotes cerrados</div></div>
    <div class="card kpi ${viejos.length ? 'warn' : ''}"><div class="lbl">Esperando corte</div><div class="val">${pendM} <small>moldes</small></div><div class="det">${pend.length} lote(s) · ${viejos.length ? viejos.length + ' con ' + cfg('dias_alerta') + '+ días' : 'ninguno demorado'}</div></div>
    <div class="card kpi dark"><div class="lbl">Lotes cerrados</div><div class="val">${cerr.length} <small>/ ${semana.length}</small></div><div class="det">de esta semana</div></div>
  </div>
  ${viejosAnt.length ? `<div class="alert warn" style="margin-top:16px"><span>🟠</span><div>Hay <b>${viejosAnt.length} lote(s) de semanas anteriores</b> sin cortar: ${viejosAnt.map(r => `L${r.lote} ${fmtD(r.fecha)} ${esc(vCorto(r.variedad_id))}`).join(', ')}. <a href="#" onclick="UI.ws='${lunesDe(viejosAnt[0].fecha)}';render();return false">Ver esa semana</a></div></div>` : ''}
  <div class="row" style="justify-content:space-between;margin:30px 0 14px">
    <h2 style="margin:0">Semana del ${fmtD(ws)} al ${fmtD(addDays(ws, 5))}</h2>
    <div class="row"><button class="btn sec sm" onclick="UI.ws='${addDays(ws, -7)}';render()">← Anterior</button>${ws !== lunesDe(t) ? `<button class="btn sec sm" onclick="UI.ws=null;render()">Hoy</button>` : ''}<button class="btn sec sm" onclick="UI.ws='${addDays(ws, 7)}';render()">Siguiente →</button></div>
  </div>
  <div class="mcards">${dias.map(d => mLote(d, vs)).join('')}</div>
  <div class="card tw flujo-card"><table class="flujo">
    <thead><tr><th>Lote</th><th>Variedad</th>${STAGES.map(s => `<th class="stg"><span class="sn">${s.n}</span>${s.label}</th>`).join('')}<th class="stg">Descarte</th><th>Estado</th></tr></thead>
    <tbody>${dias.map(d => vs.map((v, i) => celdaFila(d, v, i, vs.length)).join('')).join('')}</tbody>
  </table></div>
  <div class="leyenda small muted">Tocá un casillero de tu paso para cargarlo o corregirlo. <span class="pill ok">OK</span> dentro de lo esperado · <span class="pill warn">Atención</span> desvío mayor a ${cfg('umbral_desvio')}% o descarte mayor a ${cfg('umbral_descarte')}% · <span class="pill crit">Alto</span></div>`;
};
function celda(d, v, s, r, I) {
  const val = r ? r[s.k] : null, ed = canEdit(s.k, r, d);
  let extra = '';
  if (s.k === 'producido' && I.desv !== null) extra = `<span class="pill ${desvNivel(I.desvPct)}">${signo(I.desv)}${I.desvPct !== null ? ' · ' + signo(I.desvPct) + '%' : ''}</span>`;
  const tip = r && r[s.k + '_por'] ? `${esc(r[s.k + '_por'])} · ${new Date(r[s.k + '_at']).toLocaleString('es-UY', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}` : '';
  const inner = isNum(val) ? `<b class="cv">${val}</b>${extra}` : ed ? `<span class="cargar">+ Cargar</span>` : `<span class="muted">—</span>`;
  return `<${ed ? 'button' : 'div'} class="cbtn ${ed ? 'ed' : ''} ${isNum(val) ? 'lleno' : ''}" ${ed ? `onclick="editar('${d}','${v.id}','${s.k}')"` : ''} title="${tip}">${inner}</${ed ? 'button' : 'div'}>`;
}
function estadoHTML(I) {
  return { vacio: `<span class="muted small">—</span>`, pedido: `<span class="pill info">En producción</span>`, enfriando: `<span class="pill ${I.nivel}">Enfriando · ${I.espera <= 0 ? 'hoy' : I.espera + (I.espera === 1 ? ' día' : ' días')}</span>`, cerrado: `<span class="pill dark">Cerrado${I.espera !== null ? ' · ' + I.espera + 'd' : ''}</span>` }[I.estado];
}
const descHTML = I => I.desc !== null ? `<b class="cv">${I.desc}</b><span class="pill ${descNivel(I.descPct)}">${nf(I.descPct)}%</span>` : '<span class="muted">—</span>';
function celdaFila(d, v, i, n) {
  const r = fila(d, v.id), I = info(r), hoy = d === today();
  return `<tr class="${i === n - 1 ? 'last' : ''} ${hoy ? 'hoy' : ''}">
    ${i === 0 ? `<td rowspan="${n}" class="lotecell"><div class="ln">L${dow(d)}</div><div class="small">${DIAS[dow(d)]}</div><div class="small muted">${fmtD(d)}${hoy ? ' · <b style="color:var(--accent)">hoy</b>' : ''}</div></td>` : ''}
    <td><span class="vname">${vDot(v.id)} ${esc(vCorto(v.id))}</span></td>
    ${STAGES.map(s => `<td class="stg">${celda(d, v, s, r, I)}</td>`).join('')}
    <td class="stg">${descHTML(I)}</td>
    <td>${estadoHTML(I)}</td></tr>`;
}
function mLote(d, vs) {
  const hoy = d === today();
  return `<div class="card mlote ${hoy ? 'hoy' : ''}"><div class="ml-h"><span class="ln">L${dow(d)}</span> ${DIAS[dow(d)]} <span class="muted">${fmtD(d)}</span>${hoy ? ' <span class="pill" style="background:var(--accent);color:#fff">hoy</span>' : ''}</div>
    ${vs.map(v => { const r = fila(d, v.id), I = info(r); return `<div class="ml-v"><div class="row" style="justify-content:space-between"><span class="vname">${vDot(v.id)} ${esc(vCorto(v.id))}</span>${estadoHTML(I)}</div>
      <div class="ml-steps">${STAGES.map(s => `<div><div class="ml-l"><span class="sn">${s.n}</span>${s.k === 'cortado' ? 'Cortado' : s.label}</div>${celda(d, v, s, r, I)}</div>`).join('')}<div><div class="ml-l">Descarte</div><div class="cbtn">${descHTML(I)}</div></div></div></div>`; }).join('')}</div>`;

/* ---------- "Tu tarea": carga rápida según el rol ---------- */
function tarea() {
  const me = ME(), r = rol(), t = today(), vs = vAct();
  if (!r.edita.length || esJefe()) return '';
  const st = STAGES.find(s => r.edita.includes(s.k));
  if (st.k === 'cortado') {
    const pend = S.flujo.filter(x => isNum(x.producido) && !isNum(x.cortado)).sort((a, b) => a.fecha.localeCompare(b.fecha));
    const lotes = [...new Set(pend.map(x => x.fecha))];
    return `<div class="card tarea"><div class="eyebrow"><span>${st.icon}</span>Tu paso · ${st.n} de 3</div><h3>¿Cuántos moldes ${st.verbo}?</h3>
      ${lotes.length ? lotes.map(f => { const I = info(pend.find(x => x.fecha === f)); return `<div class="tlote"><div class="tl-h"><b>Lote ${dow(f)}</b> · ${DIAS[dow(f)]} ${fmtD(f)} <span class="pill ${I.nivel}">${I.espera <= 0 ? 'de hoy' : 'hace ' + I.espera + (I.espera === 1 ? ' día' : ' días')}</span></div>
        <div class="tl-rows">${pend.filter(x => x.fecha === f).map(x => `<div class="vrow"><div><div class="vname">${vDot(x.variedad_id)} ${esc(vCorto(x.variedad_id))}</div><div class="vmeta">Producidos: <b>${x.producido}</b></div></div>${stepper('t_' + x.id, '')}</div>`).join('')}</div>
        <button class="btn" onclick="guardarCorte('${f}')">Guardar lote ${dow(f)} · ${fmtD(f)}</button></div>`; }).join('') : '<div class="empty" style="box-shadow:none;background:var(--soft)"><h3>Todo <em>al día</em></h3>No hay lotes esperando corte.</div>'}</div>`;
  }
  // pedido / producido: elegir el día (lote) de la semana
  let f = UI.tf;
  if (!f) { f = t; if (st.k === 'pedido' && new Date().getHours() >= 13) f = addDays(t, 1); if (dow(f) === 0) f = addDays(f, 1); UI.tf = f; }
  const ws = lunesDe(f), dias = [0, 1, 2, 3, 4, 5].map(i => addDays(ws, i));
  return `<div class="card tarea"><div class="eyebrow"><span>${st.icon}</span>Tu paso · ${st.n} de 3</div><h3>¿Cuántos moldes ${st.verbo}?</h3>
    <div class="chips daychips">${dias.map(d => `<button class="${d === f ? 'on' : ''}" onclick="UI.tf='${d}';render()"><b>L${dow(d)}</b> ${DIAS3[dow(d)]} ${fmtD(d)}</button>`).join('')}<button onclick="UI.tf='${addDays(ws, 7)}';render()">→</button></div>
    <div class="tl-rows">${vs.map(v => { const x = fila(f, v.id), ok = canEdit(st.k, x, f); return `<div class="vrow"><div><div class="vname">${vDot(v.id)} ${esc(vCorto(v.id))}</div><div class="vmeta">${st.k === 'producido' ? `Pedido: <b>${x && isNum(x.pedido) ? x.pedido : 'sin pedido'}</b>` : (x && isNum(x.pedido) ? 'Ya cargado: podés corregirlo' : 'Lote ' + dow(f) + ' · ' + DIAS[dow(f)])}${!ok && x ? ' · <span class="pill">ya pasó al paso siguiente</span>' : ''}</div></div>${ok ? stepper('t_' + v.id, x ? x[st.k] : '') : `<b class="cv">${x ? x[st.k] ?? '—' : '—'}</b>`}</div>`; }).join('')}</div>
    <button class="btn big" onclick="guardarTarea('${st.k}')">Guardar lote ${dow(f)} · ${DIAS[dow(f)].toLowerCase()} ${fmtD(f)}</button></div>`;
}
async function guardarTarea(k) {
  const f = UI.tf; let n = 0;
  await safe(async () => {
    for (const v of vAct()) { const q = num('t_' + v.id), x = fila(f, v.id); if (q === null || !canEdit(k, x, f)) continue; if (x && x[k] === q) continue; await guardarValor(f, v.id, k, q); n++; }
    toast(n ? `✅ Lote ${dow(f)} guardado` : 'No había cambios'); render();
  });
}
async function guardarCorte(f) {
  let n = 0;
  await safe(async () => {
    for (const x of S.flujo.filter(r => r.fecha === f && isNum(r.producido) && !isNum(r.cortado))) { const q = num('t_' + x.id); if (q === null) continue; await guardarValor(f, x.variedad_id, 'cortado', q); n++; }
    toast(n ? `✅ Lote ${dow(f)} cerrado` : 'Completá al menos una variedad', !n); render();
  });
}

/* ---------- edición de un casillero ---------- */
function editar(d, vid, k) {
  const r = fila(d, vid), s = STAGES.find(x => x.k === k), prev = STAGES[s.n - 2];
  modal(`<div class="eyebrow"><span>${s.n}</span>${s.label}</div><h3>Lote ${dow(d)} · <em>${DIAS[dow(d)].toLowerCase()} ${fmtD(d)}</em></h3>
    <div class="vname" style="margin:6px 0 4px">${vDot(vid)} ${esc(vById(vid).nombre)}</div>
    ${prev ? `<div class="small muted">${prev.label}: <b>${r && isNum(r[prev.k]) ? r[prev.k] : 'sin cargar'}</b></div>` : ''}
    <label class="f">¿Cuántos moldes ${s.verbo}?</label>${stepper('e_q', r ? r[k] : '')}
    ${r && r[k + '_por'] ? `<div class="small muted" style="margin-top:8px">Último cambio: ${esc(r[k + '_por'])}, ${new Date(r[k + '_at']).toLocaleString('es-UY')}</div>` : ''}
    <div class="row" style="margin-top:20px"><button class="btn" style="flex:1" onclick="guardarEdicion('${d}','${vid}','${k}')">Guardar</button>${esJefe() && r && isNum(r[k]) ? `<button class="btn sec" onclick="guardarEdicion('${d}','${vid}','${k}',true)">Vaciar</button>` : ''}<button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);
  setTimeout(() => $('#e_q')?.focus(), 50);
}
async function guardarEdicion(d, vid, k, vaciar) {
  const q = vaciar ? null : num('e_q');
  if (!vaciar && q === null) return toast('Ingresá una cantidad', true);
  await safe(async () => { await guardarValor(d, vid, k, q); closeModal(); toast('✅ Guardado'); render(); });
}

  </div>
  <div class="grid g2" style="margin-top:16px">

function informe(F) {
  const rows = S.flujo.filter(r => r.fecha >= F.desde && r.fecha <= F.hasta && (!F.v || r.variedad_id === F.v)).sort((a, b) => a.fecha.localeCompare(b.fecha) || vById(a.variedad_id).orden - vById(b.variedad_id).orden);
  const sum = (arr, f) => arr.reduce((s, r) => s + f(r), 0);
  const both = rows.filter(r => isNum(r.pedido) && isNum(r.producido)), cerr = rows.filter(r => isNum(r.cortado));
  const ped = sum(both, r => r.pedido), prod = sum(both, r => r.producido);
  const desc = sum(cerr, r => r.producido - r.cortado), prodCerr = sum(cerr, r => r.producido);
  const esperas = cerr.filter(r => r.fecha_corte).map(r => diffDays(r.fecha_corte, r.fecha));
  const porVar = S.variedades.filter(v => !F.v || v.id === F.v).map(v => { const rv = rows.filter(r => r.variedad_id === v.id), b = rv.filter(r => isNum(r.pedido) && isNum(r.producido)), c = rv.filter(r => isNum(r.cortado)); return { id: v.id, ped: sum(b, r => r.pedido), prod: sum(rv, r => r.producido || 0), cort: sum(c, r => r.cortado), desc: sum(c, r => r.producido - r.cortado), prodC: sum(c, r => r.producido) }; }).filter(x => x.ped || x.prod);
  const fechas = [...new Set(rows.map(r => r.fecha))];
  const dias = fechas.map(f => { const rf = rows.filter(r => r.fecha === f), c = rf.filter(r => isNum(r.cortado)); return { f, ped: sum(rf, r => r.pedido || 0), prod: sum(rf, r => r.producido || 0), cort: sum(rf, r => r.cortado || 0), descP: pct(sum(c, r => r.producido - r.cortado), sum(c, r => r.producido)) }; });
  return { rows, ped, prod, cump: pct(prod, ped), lotesDesv: both.filter(r => r.pedido && Math.abs(pct(r.producido - r.pedido, r.pedido)) > cfg('umbral_desvio')).length, desc, prodCerr, descP: pct(desc, prodCerr), esperaProm: esperas.length ? esperas.reduce((a, b) => a + b, 0) / esperas.length : null, cerrados: cerr.length, abiertos: rows.filter(r => isNum(r.producido) && !isNum(r.cortado)).length, porVar, dias };
}
AFTER.informes = () => {
  if (!window.Chart) return;
  const R = informe(UI.F), lab = R.dias.map(d => fmtDL(d.f));
  const base = { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, font: { family: 'Inter' } } } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(14,28,58,.07)' } }, x: { grid: { display: false } } } };
  CHARTS.push(new Chart($('#ch1'), { type: 'bar', data: { labels: lab, datasets: [{ label: 'Pedido', data: R.dias.map(d => d.ped), backgroundColor: '#C9D6E6', borderRadius: 6 }, { label: 'Producido', data: R.dias.map(d => d.prod), backgroundColor: '#0E1C3A', borderRadius: 6 }, { label: 'Cortado', data: R.dias.map(d => d.cort), backgroundColor: '#E9743A', borderRadius: 6 }] }, options: base }));
  CHARTS.push(new Chart($('#ch2'), { type: 'line', data: { labels: lab, datasets: [{ label: '% descarte', data: R.dias.map(d => d.descP), borderColor: '#C8473B', backgroundColor: 'rgba(200,71,59,.15)', fill: true, tension: .35, spanGaps: true }, { label: 'Límite', data: R.dias.map(() => cfg('umbral_descarte')), borderColor: '#CDA85E', borderDash: [6, 6], pointRadius: 0 }] }, options: base }));
};
function exportar() {
  if (!window.XLSX) return toast('No se pudo cargar el exportador', true);
  const F = UI.F, R = informe(F), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(R.rows.map(r => { const I = info(r); return { 'Fecha lote': r.fecha, Día: DIAS[dow(r.fecha)], Lote: 'L' + r.lote, Variedad: vById(r.variedad_id).nombre, Pedido: r.pedido ?? '', Producido: r.producido ?? '', 'Desvío producción': I.desv ?? '', 'Desvío %': I.desvPct ?? '', Cortado: r.cortado ?? '', 'Fecha corte': r.fecha_corte || '', Descarte: I.desc ?? '', 'Descarte %': I.descPct ?? '', 'Días de espera': I.espera ?? '', 'Pedido por': r.pedido_por || '', 'Producido por': r.producido_por || '', 'Cortado por': r.cortado_por || '' }; })), 'Lotes');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(R.porVar.map(x => ({ Variedad: vById(x.id).nombre, Pedido: x.ped, Producido: x.prod, 'Cumplimiento %': x.ped ? pct(x.prod, x.ped) : '', Cortado: x.cort, Descarte: x.desc, 'Descarte %': x.prodC ? pct(x.desc, x.prodC) : '' }))), 'Por variedad');
  XLSX.writeFile(wb, `pan-molde_${F.desde}_a_${F.hasta}.xlsx`);
}

  const k = id || 'new', nombre = $('#vn_' + k).value.trim(), o = parseInt($('#vo_' + k).value) || 0;

  <div class="card tw"><table><thead><tr><th>Rol</th><th>Alcance</th>${STAGES.map(s => `<th style="text-align:center">${s.n} · ${s.label}</th>`).join('')}<th style="text-align:center">Informes</th></tr></thead><tbody>
  ${orden.map(k => { const r = ROLES[k]; return `<tr><td><span class="rolechip" style="background:${r.color}22;color:${r.color === '#CDA85E' ? '#8A6516' : r.color}">${r.label}</span></td><td class="small muted" style="min-width:220px">${r.desc}</td>${STAGES.map(s => `<td style="text-align:center">${r.edita.includes(s.k) ? '✏️' : '👁'}</td>`).join('')}<td style="text-align:center">${r.views.includes('informes') ? '✓' : '—'}</td></tr>`; }).join('')}
  </tbody></table><div class="small muted" style="margin-top:10px">✏️ carga y corrige · 👁 solo ve. Un encargado puede corregir su paso mientras el siguiente no esté cargado; después solo Administración o Supervisión.</div></div>`;
};
const activeAdmins = () => S.personas.filter(p => p.activo && p.rol === 'admin');
async function crearUsuario() {
  if (ME()?.rol !== 'admin') return;
  const n = $('#nu_n').value.trim(), r = $('#nu_r').value, pin = $('#nu_p').value.trim();
  if (!n) return toast('Falta el nombre', true);
  if (S.personas.some(p => p.nombre.toLowerCase() === n.toLowerCase())) return toast('Ya existe un usuario con ese nombre', true);
  if (!/^\d{4}$/.test(pin)) return toast('El PIN tiene que ser de 4 números', true);
  await safe(async () => { const id = uid(); await DB.ins('personas', { id, nombre: n, rol: r, activo: true, pin_hash: await hashPin(id, pin) }); toast(`✅ ${n} creado como ${ROLES[r].label}`); render(); });
}
async function cambiarRol(id, r) {
  if (ME()?.rol !== 'admin') return;
  const p = S.personas.find(x => x.id === id);
  if (p.rol === 'admin' && r !== 'admin' && activeAdmins().length <= 1) { toast('Tiene que quedar al menos un administrador', true); return render(); }
  await safe(async () => { await DB.upd('personas', id, { rol: r }); toast(`${p.nombre}: ${ROLES[r].label}`); render(); });
}
async function toggleUser(id) {
  if (ME()?.rol !== 'admin') return;
  const p = S.personas.find(x => x.id === id);
  if (p.id === ME().id) return toast('No podés desactivarte a vos', true);
  if (p.activo && p.rol === 'admin' && activeAdmins().length <= 1) return toast('Tiene que quedar al menos un administrador', true);
  await safe(async () => { await DB.upd('personas', id, { activo: !p.activo }); render(); });
}
function resetPin(id) {
  const p = S.personas.find(x => x.id === id);
  modal(`<h3>Nuevo PIN para <em>${esc(p.nombre)}</em></h3><label class="f">PIN (4 números)</label><input type="text" inputmode="numeric" maxlength="4" id="rp_p">
  <div class="row" style="margin-top:16px"><button class="btn" style="flex:1" onclick="guardarResetPin('${id}')">Guardar PIN</button><button class="btn sec" onclick="closeModal()">Cancelar</button></div>`);
}
async function guardarResetPin(id) {
  const pin = $('#rp_p').value.trim(); if (!/^\d{4}$/.test(pin)) return toast('El PIN tiene que ser de 4 números', true);
  await safe(async () => { await DB.upd('personas', id, { pin_hash: await hashPin(id, pin) }); closeModal(); toast('✅ PIN actualizado'); render(); });
}

/* =====================================================================
   INGRESO CON PIN
   ===================================================================== */
function modal(html) { $('#modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal() { $('#modal').innerHTML = ''; }
let LG = { step: 'users', pid: null, pin: '', fails: 0, lockUntil: 0 };
function renderLogin() {
  const el = $('#login'), admins = S.personas.filter(p => p.activo && p.rol === 'admin' && p.pin_hash);
  if (!admins.length) {
    el.innerHTML = `<div class="login"><div class="login-in"><div class="eyebrow"><span>00</span>Primer ingreso</div><h1>Creá el usuario <em>administrador</em></h1><div class="sub">Después vas a poder crear a los encargados y asignarles su paso.</div>
      <div class="pinbox" style="max-width:440px;margin:0"><label class="f" style="margin-top:0">Nombre</label><input type="text" id="ad_n" placeholder="Ej. Gabi">
      <label class="f">PIN de 4 números</label><input type="password" inputmode="numeric" maxlength="4" id="ad_p1" placeholder="••••">
      <label class="f">Repetí el PIN</label><input type="password" inputmode="numeric" maxlength="4" id="ad_p2" placeholder="••••">
      <div style="margin-top:20px"><button class="btn big" onclick="crearAdmin()">Crear y entrar</button></div></div></div></div>`;
    return;
  }
  const ps = S.personas.filter(p => p.activo && p.pin_hash && ROLES[p.rol]).sort((a, b) => a.nombre.localeCompare(b.nombre));
  const p = LG.step === 'pin' && ps.find(x => x.id === LG.pid);
  if (p) {
    el.innerHTML = `<div class="login"><div class="login-in"><div class="pinbox" id="pinbox">
      <div class="row" style="gap:12px"><div class="avatar" style="background:${ROLES[p.rol].color}">${esc(p.nombre[0].toUpperCase())}</div><div><div style="font-family:var(--font-title);font-weight:700;font-size:18px">${esc(p.nombre)}</div><div class="small muted">${ROLES[p.rol].label}</div></div></div>
      <div class="pindots">${[0, 1, 2, 3].map(i => `<i class="${i < LG.pin.length ? 'on' : ''}"></i>`).join('')}</div>
      <div id="pinmsg" class="small" style="text-align:center;min-height:22px;margin:-10px 0 8px;color:var(--crit)">${LG.lockUntil > Date.now() ? 'Demasiados intentos. Esperá unos segundos.' : ''}</div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="pinKey('${n}')">${n}</button>`).join('')}<button class="k2" onclick="LG.step='users';LG.pin='';render()">← Volver</button><button onclick="pinKey('0')">0</button><button class="k2" onclick="LG.pin=LG.pin.slice(0,-1);render()">Borrar</button></div>
      ${LIVE ? '' : '<div class="small muted" style="text-align:center;margin-top:14px">Modo demo: el PIN de todos es <b>1234</b></div>'}</div></div></div>`;
    return;
  }
  el.innerHTML = `<div class="login"><div class="login-in"><div class="eyebrow"><span>🍞</span>Panificadora Amsterdam</div><h1>Pan de molde, <em>lote a lote</em></h1><div class="sub">Tocá tu nombre para ingresar.</div>
    <div class="ucards">${ps.map(p => `<button class="ucard" onclick="LG.step='pin';LG.pid='${p.id}';LG.pin='';render()"><div class="avatar" style="background:${ROLES[p.rol].color}">${esc(p.nombre[0].toUpperCase())}</div><b>${esc(p.nombre)}</b><small>${ROLES[p.rol].label}</small></button>`).join('')}</div></div></div>`;
}
document.addEventListener('keydown', e => { if (!ME() && LG.step === 'pin' && $('#pinbox')) { if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') { LG.pin = LG.pin.slice(0, -1); render(); } } });
async function pinKey(n) {
  if (LG.lockUntil > Date.now()) return render();
  if (LG.pin.length >= 4) return;
  LG.pin += n; render();
  if (LG.pin.length < 4) return;
  const p = S.personas.find(x => x.id === LG.pid);
  if (p && await hashPin(p.id, LG.pin) === p.pin_hash) { localStorage.setItem('pm_sess', p.id); LG = { step: 'users', pid: null, pin: '', fails: 0, lockUntil: 0 }; VIEW = 'flujo'; UI = {}; render(); toast('Hola, ' + p.nombre); }
  else { LG.fails++; LG.pin = ''; if (LG.fails >= 5) { LG.lockUntil = Date.now() + 30000; LG.fails = 0; setTimeout(render, 30100); } render(); const b = $('#pinbox'); if (b) { b.classList.add('shake'); $('#pinmsg').textContent = LG.lockUntil > Date.now() ? 'Demasiados intentos. Esperá 30 segundos.' : 'PIN incorrecto'; } }
}
async function crearAdmin() {
  const n = $('#ad_n').value.trim(), p1 = $('#ad_p1').value, p2 = $('#ad_p2').value;
  if (!n) return toast('Falta el nombre', true); if (!/^\d{4}$/.test(p1)) return toast('El PIN tiene que ser de 4 números', true); if (p1 !== p2) return toast('Los PIN no coinciden', true);
  await safe(async () => { const id = uid(); await DB.ins('personas', { id, nombre: n, rol: 'admin', activo: true, pin_hash: await hashPin(id, p1) }); localStorage.setItem('pm_sess', id); render(); toast('Listo, ' + n + '. Creá a los encargados en Usuarios.'); });
}
function logout() { localStorage.removeItem('pm_sess'); closeModal(); LG = { step: 'users', pid: null, pin: '', fails: 0, lockUntil: 0 }; render(); }
function menuUser() {
  const p = ME(); if (!p) return;
  modal(`<div class="row" style="gap:14px"><div class="avatar" style="width:52px;height:52px;font-size:20px;background:${rol().color}">${esc(p.nombre[0].toUpperCase())}</div><div><h3>${esc(p.nombre)}</h3><span class="pill">${rol().label}</span></div></div>
  <p class="small muted" style="margin:14px 0">${rol().desc}</p>
  <label class="f">Cambiar mi PIN</label><div class="row"><input type="password" inputmode="numeric" maxlength="4" id="mp_1" placeholder="Nuevo PIN" style="flex:1"><input type="password" inputmode="numeric" maxlength="4" id="mp_2" placeholder="Repetir" style="flex:1"><button class="btn sec sm" onclick="cambiarMiPin()">Guardar</button></div>
  <div class="sep"></div><div class="row"><button class="btn dark" style="flex:1" onclick="logout()">Cerrar sesión</button><button class="btn sec" onclick="closeModal()">Volver</button></div>`);
}
async function cambiarMiPin() {
  const a = $('#mp_1').value, b = $('#mp_2').value;
  if (!/^\d{4}$/.test(a)) return toast('El PIN tiene que ser de 4 números', true); if (a !== b) return toast('Los PIN no coinciden', true);
  await safe(async () => { await DB.upd('personas', ME().id, { pin_hash: await hashPin(ME().id, a) }); closeModal(); toast('✅ PIN actualizado'); });
}

/* ---------- datos de ejemplo (solo demo) ---------- */
function seedDemo() {
  if (LIVE) return;
  const t = today(), [vB, vI] = vAct(), rnd = (a, z) => a + Math.floor(Math.random() * (z - a + 1)), out = [];
  for (let i = -20; i <= 0; i++) {
    const d = addDays(t, i); if (dow(d) === 0) continue;
    for (const [v, base] of [[vB, 60], [vI, 24]]) {
      const ped = base + rnd(-5, 5), r = { id: uid(), fecha: d, lote: dow(d), variedad_id: v.id, pedido: ped, pedido_por: 'Encargado 1', pedido_at: d + 'T07:00:00', created_at: d + 'T07:00:00' };
      if (i < 0 || new Date().getHours() >= 12) { r.producido = Math.max(0, ped + (Math.random() < .25 ? rnd(-8, 6) : rnd(-1, 1))); r.producido_por = 'Encargado 2'; r.producido_at = d + 'T13:00:00'; }
      let fc = addDays(d, Math.random() < .7 ? 1 : 2); if (dow(fc) === 0) fc = addDays(fc, 1);
      if (isNum(r.producido) && fc < t) { r.cortado = r.producido - (Math.random() < .3 ? rnd(1, Math.max(1, Math.round(r.producido * .12))) : rnd(0, 1)); r.cortado_por = 'Encargado 3'; r.cortado_at = fc + 'T09:00:00'; r.fecha_corte = fc; }
      out.push(r);
    }
  }
  S.flujo = out; demoSave(); toast('Datos de ejemplo cargados (3 semanas)'); go('flujo');
}

/* ---------- arranque ---------- */
let reloadT = null, pendingRefresh = false;
function scheduleReload() { clearTimeout(reloadT); reloadT = setTimeout(async () => { try { await DB.load(); if (!ME()) return render(); const a = document.activeElement; if ((a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName)) || $('#modal').innerHTML) { pendingRefresh = true; return; } render(); } catch (e) { console.error(e); } }, 600); }
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRefresh && !document.activeElement?.matches('input,select,textarea') && !$('#modal').innerHTML) { pendingRefresh = false; render(); } }, 300));
(async function init() {
  $('#mode').textContent = LIVE ? 'EN LÍNEA' : 'DEMO'; $('#mode').className = 'badge-mode' + (LIVE ? ' live' : '');
  try {
    if (LIVE) {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      await DB.load();
      sb.channel('pm').on('postgres_changes', { event: '*', schema: 'public' }, p => { if (p.table && p.table.startsWith('pm_')) scheduleReload(); }).subscribe();
      setInterval(scheduleReload, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleReload(); });
    } else await DB.load();
    render();
  } catch (e) {
    console.error(e);
    $('#view').innerHTML = `<div class="empty"><h3>No se pudo <em>conectar</em></h3>${esc(e.message || e)}<br><br>Revisá que exista la tabla pm_flujo en Supabase.<br><br><button class="btn" onclick="location.reload()">Reintentar</button></div>`;
  }
})();
