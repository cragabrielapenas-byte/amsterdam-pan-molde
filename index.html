async function hashPin(id, pin) {
  const txt = 'pm|' + id + '|' + pin;
  if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const c of txt) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return 'f' + h.toString(16);
}

/* ===================== cálculo de stock (siempre derivado) ===================== */
function calc() {
  if (CALCV === VER && CALC) return CALC;
  const t = today();
  const lots = S.lotes.filter(l => !l.anulado).map(l => ({ ...l, cort: 0, paq: 0, descPend: 0, descCorte: 0, descTerm: 0, desp: 0, ajP: 0, ajT: 0, primerCorte: null, ultCorte: null }));
  const byId = Object.fromEntries(lots.map(l => [l.id, l]));
  const movs = S.movs.filter(m => !m.anulado);
  for (const m of movs) {
    const L = byId[m.lote_id]; if (!L) continue;
    if (m.tipo === 'corte') { L.cort += m.moldes; L.paq += m.paquetes; if (!L.primerCorte || m.fecha < L.primerCorte) L.primerCorte = m.fecha; if (!L.ultCorte || m.fecha > L.ultCorte) L.ultCorte = m.fecha; }
    else if (m.tipo === 'descarte') { if (m.etapa === 'pendiente') L.descPend += m.moldes; else if (m.etapa === 'corte') L.descCorte += m.moldes; else L.descTerm += m.paquetes; }
    else if (m.tipo === 'despacho') L.desp += m.paquetes;
    else if (m.tipo === 'ajuste') { if (m.etapa === 'terminado') L.ajT += m.paquetes; else L.ajP += m.moldes; }
  }
  for (const L of lots) {
    L.pend = L.moldes - L.cort - L.descPend - L.descCorte + L.ajP;
    L.disp = L.paq - L.desp - L.descTerm + L.ajT;
    L.consumido = L.moldes - L.pend;
    L.edad = diffDays(t, L.fecha);
    L.edadTerm = L.primerCorte ? diffDays(t, L.primerCorte) : null;
    L.nivel = L.edad >= cfg('dias_critico') ? 'crit' : L.edad >= cfg('dias_alerta') ? 'warn' : 'ok';
    L.nivelT = L.edadTerm === null ? 'ok' : L.edadTerm > cfg('vida_util') ? 'crit' : L.edadTerm === cfg('vida_util') ? 'warn' : 'ok';
  }
  lots.sort((a, b) => a.fecha.localeCompare(b.fecha) || vById(a.variedad_id).orden - vById(b.variedad_id).orden);
  CALC = { lots, byId, movs }; CALCV = VER; return CALC;
}
const pedidoDe = (fecha, vid) => S.pedidos.find(p => !p.anulado && p.fecha === fecha && p.variedad_id === vid);
const loteDe = (fecha, vid) => S.lotes.find(l => !l.anulado && l.fecha === fecha && l.variedad_id === vid);
const moldesEq = m => m.tipo === 'descarte' && m.etapa === 'terminado' ? m.paquetes / (Number(vById(lotVar(m)).rendimiento) || 1) : m.moldes;
const lotVar = m => (calc().byId[m.lote_id] || S.lotes.find(l => l.id === m.lote_id) || {}).variedad_id;
function ageLbl(d) { return d <= 0 ? 'Hoy' : d === 1 ? 'Hace 1 día' : `Hace ${d} días`; }

/* ---------- stepper ---------- */
function stepper(id, val, min = 0, oninput = '') {
  return `<div class="step"><button type="button" onclick="stepBy('${id}',-1)">−</button><input type="number" inputmode="numeric" id="${id}" value="${val ?? ''}" min="${min}" placeholder="0" oninput="${oninput}"><button type="button" onclick="stepBy('${id}',1)">+</button></div>`;
}
function stepBy(id, d) { const i = document.getElementById(id); const v = Math.max(Number(i.min || 0), (parseInt(i.value) || 0) + d); i.value = v; i.dispatchEvent(new Event('input')); }
const num = id => { const el = document.getElementById(id); if (!el || el.value === '') return null; const n = parseInt(el.value); return isNaN(n) ? null : n; };

V.inicio = () => {
  const C = calc(), t = today(), vs = vAct();
  const pend = C.lots.filter(l => l.pend > 0), term = C.lots.filter(l => l.disp > 0);
  const totPend = pend.reduce((s, l) => s + l.pend, 0), totDisp = term.reduce((s, l) => s + l.disp, 0);
  const viejos = pend.filter(l => l.edad >= cfg('dias_alerta')), viejosM = viejos.reduce((s, l) => s + l.pend, 0);
  const pedHoy = vs.reduce((s, v) => s + (pedidoDe(t, v.id)?.cantidad || 0), 0);
  const prodHoy = vs.reduce((s, v) => s + (loteDe(t, v.id)?.moldes || 0), 0);
  const descHoy = C.movs.filter(m => m.tipo === 'descarte' && m.fecha === t);
  const descHoyM = descHoy.filter(m => m.etapa !== 'terminado').reduce((s, m) => s + m.moldes, 0);
  const descHoyP = descHoy.filter(m => m.etapa === 'terminado').reduce((s, m) => s + m.paquetes, 0);
  const cump = pct(prodHoy, pedHoy);
  const al = alertas(C);
  const domingo = dow(t) === 0;
  return `
  ${H(1,'Resumen','Resumen','del día')}<div class="sub">${DIAS[dow(t)][0].toUpperCase() + DIAS[dow(t)].slice(1)} ${fmtD(t)} ${domingo ? '· Hoy no se produce' : '· Lote del día: <b>L' + loteNum(t) + '</b>'}</div>
  <div class="grid g4">
    <div class="card kpi ${viejosM ? 'warn' : ''}"><div class="lbl">Moldes esperando corte</div><div class="val">${totPend}</div><div class="det">${vs.map(v => vDot(v.id) + ' ' + pend.filter(l => l.variedad_id === v.id).reduce((s, l) => s + l.pend, 0)).join(' &nbsp; ')}</div></div>
    <div class="card kpi ${viejos.some(l => l.nivel === 'crit') ? 'crit' : viejosM ? 'warn' : 'okk'}"><div class="lbl">Con ${cfg('dias_alerta')}+ días</div><div class="val">${viejosM} <small>moldes</small></div><div class="det">${viejos.length ? viejos.length + ' lote(s): ' + viejos.map(loteLbl).slice(0, 3).join(', ') : 'Nada acumulado'}</div></div>
    <div class="card kpi"><div class="lbl">Paquetes listos p/ despacho</div><div class="val">${totDisp}</div><div class="det">${vs.map(v => vDot(v.id) + ' ' + term.filter(l => l.variedad_id === v.id).reduce((s, l) => s + l.disp, 0)).join(' &nbsp; ')}</div></div>
    <div class="card kpi ${cump === null ? '' : Math.abs(cump - 100) > cfg('umbral_desvio') ? 'warn' : 'okk'}"><div class="lbl">Producción hoy vs pedido</div><div class="val">${prodHoy} <small>/ ${pedHoy}</small></div><div class="det">${cump === null ? (pedHoy ? '' : 'Sin pedido cargado') : 'Cumplimiento ' + nf(cump) + '%'}</div></div>
    <div class="card kpi ${descHoy.length ? 'warn' : ''}"><div class="lbl">Descartes de hoy</div><div class="val">${descHoyM} <small>moldes</small></div><div class="det">${descHoyP} paquetes envasados</div></div>
  </div>
  <div class="quick">
    ${[['pedidos', '📝', 'Cargar pedido'], ['produccion', '🔥', 'Registrar producción'], ['sandwicheria', '🔪', 'Registrar corte'], ['stock', '🚚', 'Despachar'], ['descartes', '🗑️', 'Descartar'], ['informes', '📈', 'Ver informes']].filter(([k]) => canView(k) && (canWrite() || k === 'informes')).map(([k, i, l]) => `<button class="btn" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}

  <h2>Por variedad</h2>
  <div class="card tw"><table><thead><tr><th>Variedad</th><th class="n">Pedido hoy</th><th class="n">Producido hoy</th><th class="n">Esperando corte</th><th>Más antiguo</th><th class="n">Paquetes listos</th></tr></thead><tbody>
  ${vs.map(v => { const pl = pend.filter(l => l.variedad_id === v.id); const old = pl[0]; const pe = pedidoDe(t, v.id), lo = loteDe(t, v.id);
    return `<tr><td>${vDot(v.id)} <b>${esc(v.nombre)}</b></td><td class="n">${pe ? pe.cantidad : '—'}</td><td class="n">${lo ? lo.moldes : '—'}</td><td class="n"><b>${pl.reduce((s, l) => s + l.pend, 0)}</b></td><td>${old ? `<span class="pill ${old.nivel}">${loteLbl(old)} · ${ageLbl(old.edad)}</span>` : '—'}</td><td class="n"><b>${term.filter(l => l.variedad_id === v.id).reduce((s, l) => s + l.disp, 0)}</b></td></tr>`; }).join('')}

};
function alertas(C) {
  const t = today(), out = [], vs = vAct();
  for (const l of C.lots.filter(l => l.pend > 0 && l.nivel !== 'ok'))
    out.push([l.nivel, `<b>${l.pend} moldes de ${esc(vById(l.variedad_id).nombre)}</b> del lote ${loteLbl(l)} llevan <b>${l.edad} días</b> esperando corte.`]);
  for (const l of C.lots.filter(l => l.disp > 0 && l.nivelT !== 'ok'))
    out.push([l.nivelT, `<b>${l.disp} paquetes de ${esc(vById(l.variedad_id).nombre)}</b> (lote ${loteLbl(l)}) envasados hace ${l.edadTerm} días. Vida útil: ${cfg('vida_util')} días.`]);
  for (const v of vs) {
    const pe = pedidoDe(t, v.id), lo = loteDe(t, v.id);
    if (pe && lo && pe.cantidad) { const d = lo.moldes - pe.cantidad, p = pct(d, pe.cantidad); if (Math.abs(p) > cfg('umbral_desvio')) out.push(['warn', `Producción de ${esc(v.nombre)} hoy: <b>${lo.moldes}</b> vs pedido <b>${pe.cantidad}</b> (${d > 0 ? '+' : ''}${d}, ${p > 0 ? '+' : ''}${nf(p)}%).${lo.motivo_desvio ? ' Motivo: ' + esc(lo.motivo_desvio) : ''}`]); }
    if (pe && !lo && pe.cantidad > 0 && dow(t) !== 0) out.push(['info', `Hay pedido de <b>${pe.cantidad}</b> moldes de ${esc(v.nombre)} para hoy y todavía no se registró la producción.`]);
    if (lo && !pe) out.push(['info', `Se registró producción de ${esc(v.nombre)} hoy (${lo.moldes}) sin pedido cargado.`]);
  }
  const man = addDays(t, 1); const manD = dow(man) === 0 ? addDays(t, 2) : man;
  if (!vs.some(v => pedidoDe(manD, v.id))) out.push(['info', `Todavía no hay pedido cargado para el ${DIAS[dow(manD)]} ${fmtD(manD)}.`]);
  const d7 = addDays(t, -7);
  const cortes = C.movs.filter(m => m.tipo === 'corte' && m.fecha >= d7 && m.moldes > 0);
  for (const v of vs) {
    const cs = cortes.filter(m => lotVar(m) === v.id); const mo = cs.reduce((s, m) => s + m.moldes, 0), pq = cs.reduce((s, m) => s + m.paquetes, 0);
    if (mo) { const r = pct(pq, mo * Number(v.rendimiento)); if (r < cfg('rend_min')) out.push(['warn', `Rendimiento de corte de ${esc(v.nombre)} en 7 días: <b>${nf(r)}%</b> del estándar (${pq} paquetes de ${mo} moldes).`]); }
  }
  const ord = { crit: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((a, b) => ord[a[0]] - ord[b[0]]);
}

async function guardarPedido() {

async function guardarProd() {

AFTER.sandwicheria = () => { if (UI.lote && calc().byId[UI.lote]) restoCorte(); };
function autoPaq() { const p = document.getElementById('c_paq'), L = calc().byId[UI.lote]; if (p.dataset.manual !== '1') p.value = num('c_mol') === null ? '' : Math.round(num('c_mol') * Number(vById(L.variedad_id).rendimiento)); rendCorte(); restoCorte(); }
function rendCorte() { const L = calc().byId[UI.lote], m = num('c_mol'), p = num('c_paq'), el = document.getElementById('c_rend'); if (!m || p === null) { el.innerHTML = ''; return; } const r = pct(p, m * Number(vById(L.variedad_id).rendimiento)); el.innerHTML = `<span class="pill ${r < cfg('rend_min') ? 'warn' : 'ok'}">Rendimiento ${nf(r)}% del estándar</span>`; }
function restoCorte() {
  const L = calc().byId[UI.lote]; if (!L) return; const m = num('c_mol') || 0, d = num('c_desc') || 0, r = L.pend - m - d;
  document.getElementById('c_motbox').style.display = d > 0 ? 'block' : 'none';
  document.getElementById('c_resto').innerHTML = r < 0 ? `<span class="pill crit">Te pasaste por ${-r}: este lote tiene ${L.pend} moldes pendientes</span>` : `Después de este registro quedan <b>${r}</b> moldes pendientes del lote ${loteLbl(L)}.`;
}
async function guardarCorte() {
  if (needUser()) return;
  const L = calc().byId[UI.lote], m = num('c_mol') || 0, p = num('c_paq') || 0, d = num('c_desc') || 0;
  if (!m && !d) return toast('Indicá moldes cortados o descartados', true);
  if (m + d > L.pend) return toast(`Solo hay ${L.pend} moldes pendientes en ${loteLbl(L)}`, true);
  if (m > 0 && p === 0) return toast('Indicá cuántos paquetes se obtuvieron', true);
  if (m === 0 && p > 0) return toast('Hay paquetes pero ningún molde cortado', true);
  if (L.edad < 1 && !confirm('Este lote se produjo hoy. ¿Confirmás que ya se cortó?')) return;
  await safe(async () => {
    const base = { lote_id: L.id, fecha: today(), responsable: user(), obs: document.getElementById('c_obs').value.trim() || null };
    if (m) await DB.ins('movs', { ...base, tipo: 'corte', etapa: 'corte', moldes: m, paquetes: p });
    if (d) await DB.ins('movs', { ...base, tipo: 'descarte', etapa: 'corte', moldes: d, paquetes: 0, motivo: document.getElementById('c_mot').value });

V.stock = () => {
  const C = calc(), vs = vAct(), term = C.lots.filter(l => l.disp > 0), t = today();
  const dv = UI.dv || vs[0]?.id; UI.dv = dv;

    return `<div class="card kpi ${venc ? 'crit' : ''}"><div class="lbl">${vDot(v.id)} ${esc(v.nombre)}</div><div class="val">${tot} <small>paquetes</small></div><div class="det">${tl.map(l => `<span class="pill ${l.nivelT}" style="margin:2px 2px 0 0">${loteLbl(l)}: ${l.disp}</span>`).join('') || 'Sin stock'}</div></div>`; }).join('')}</div>

  ${movTable(desp, true)}`;

function fifo(vid, q) { const out = []; let r = q; for (const l of calc().lots.filter(l => l.variedad_id === vid && l.disp > 0)) { if (r <= 0) break; const t = Math.min(r, l.disp); out.push([l, t]); r -= t; } return { out, falta: r }; }
function prevFifo() { const q = num('d_q') || 0, el = document.getElementById('d_prev'); if (!q) { el.innerHTML = ''; return; } const f = fifo(UI.dv, q); el.innerHTML = f.falta > 0 ? `<span class="pill crit">Faltan ${f.falta} paquetes: no hay stock suficiente</span>` : 'Sale de: ' + f.out.map(([l, t]) => `<span class="pill">${loteLbl(l)}: ${t}</span>`).join(' '); }
async function guardarDesp() {
  if (needUser()) return;

  const f = fifo(UI.dv, q); if (f.falta > 0) return toast(`No hay stock suficiente (faltan ${f.falta})`, true);
  await safe(async () => {
    const g = uid(), dest = document.getElementById('d_dest').value.trim() || null;
    for (const [l, t] of f.out) await DB.ins('movs', { tipo: 'despacho', etapa: 'terminado', lote_id: l.id, fecha: today(), moldes: 0, paquetes: t, destino: dest, grupo: g, responsable: user() });
    toast(`✅ Despacho de ${q} paquetes registrado`); render();
  });
}

async function anularMov(id) {

function setRango(n) { UI.F.hasta = today(); UI.F.desde = addDays(today(), -(n - 1)); render(); }
function informe(F) {
  const C = calc(), okV = vid => !F.v || vid === F.v, inR = f => f >= F.desde && f <= F.hasta;
  const peds = S.pedidos.filter(p => !p.anulado && inR(p.fecha) && okV(p.variedad_id));
  const lots = C.lots.filter(l => inR(l.fecha) && okV(l.variedad_id));
  const movs = C.movs.filter(m => inR(m.fecha) && okV(lotVar(m)));
  const desc = movs.filter(m => m.tipo === 'descarte' && (!F.etapa || m.etapa === F.etapa));
  const cortes = movs.filter(m => m.tipo === 'corte');
  const ped = peds.reduce((s, p) => s + p.cantidad, 0), prod = lots.reduce((s, l) => s + l.moldes, 0);
  const cort = cortes.reduce((s, m) => s + m.moldes, 0), paq = cortes.reduce((s, m) => s + m.paquetes, 0);
  const estd = cortes.reduce((s, m) => s + m.moldes * Number(vById(lotVar(m)).rendimiento), 0);
  const descM = desc.filter(m => m.etapa !== 'terminado').reduce((s, m) => s + m.moldes, 0), descP = desc.filter(m => m.etapa === 'terminado').reduce((s, m) => s + m.paquetes, 0);
  const descEq = desc.reduce((s, m) => s + moldesEq(m), 0);
  let cortViejo = 0, espera = 0; cortes.forEach(m => { const L = C.byId[m.lote_id]; const e = diffDays(m.fecha, L.fecha); espera += e * m.moldes; if (e >= cfg('dias_alerta')) cortViejo += m.moldes; });
  // series diarias + stock al cierre (reconstruido con todos los movimientos hasta ese día)
  const allL = C.lots.filter(l => okV(l.variedad_id)), allM = C.movs.filter(m => okV(lotVar(m)));
  const dias = []; let diasDesvio = 0;
  for (let f = F.desde; f <= F.hasta; f = addDays(f, 1)) {
    const pe = peds.filter(p => p.fecha === f).reduce((s, p) => s + p.cantidad, 0), pr = lots.filter(l => l.fecha === f).reduce((s, l) => s + l.moldes, 0);
    if (dow(f) === 0 && !pe && !pr && !movs.some(m => m.fecha === f)) continue;
    const mf = movs.filter(m => m.fecha === f);
    const sp = allL.filter(l => l.fecha <= f).reduce((s, l) => s + l.moldes, 0) - allM.filter(m => m.fecha <= f).reduce((s, m) => s + (m.tipo === 'corte' || (m.tipo === 'descarte' && m.etapa !== 'terminado') ? m.moldes : m.tipo === 'ajuste' && m.etapa !== 'terminado' ? -m.moldes : 0), 0);
    const st = allM.filter(m => m.fecha <= f).reduce((s, m) => s + (m.tipo === 'corte' ? m.paquetes : (m.tipo === 'despacho' || (m.tipo === 'descarte' && m.etapa === 'terminado')) ? -m.paquetes : m.tipo === 'ajuste' && m.etapa === 'terminado' ? m.paquetes : 0), 0);
    if (pe && Math.abs(pct(pr - pe, pe)) > cfg('umbral_desvio')) diasDesvio++;
    dias.push({ f, ped: pe, prod: pr, cort: mf.filter(m => m.tipo === 'corte').reduce((s, m) => s + m.moldes, 0), paq: mf.filter(m => m.tipo === 'corte').reduce((s, m) => s + m.paquetes, 0), desc: mf.filter(m => m.tipo === 'descarte' && (!F.etapa || m.etapa === F.etapa)).reduce((s, m) => s + moldesEq(m), 0), desp: mf.filter(m => m.tipo === 'despacho').reduce((s, m) => s + m.paquetes, 0), sp, st });
  }
  const sem = {}; dias.forEach(d => { const k = addDays(d.f, -((dow(d.f) + 6) % 7)); const o = sem[k] || (sem[k] = { k, ped: 0, prod: 0, desc: 0, desp: 0 }); o.ped += d.ped; o.prod += d.prod; o.desc += d.desc; o.desp += d.desp; });
  const mxe = {}; desc.forEach(m => { const k = m.motivo || 'Sin motivo'; const o = mxe[k] || (mxe[k] = { tot: 0 }); const q = moldesEq(m); o[m.etapa] = (o[m.etapa] || 0) + q; o.tot += q; });
  const porEt = {}; desc.forEach(m => porEt[m.etapa] = (porEt[m.etapa] || 0) + moldesEq(m));
  return { ped, prod, cump: pct(prod, ped), diasDesvio, cort, paq, rend: pct(paq, estd), descM, descP, pDesc: pct(descEq, prod), cortViejo, pViejo: pct(cortViejo, cort), esperaProm: cort ? espera / cort : 0, desp: movs.filter(m => m.tipo === 'despacho').reduce((s, m) => s + m.paquetes, 0), stockP: C.lots.filter(l => okV(l.variedad_id)).reduce((s, l) => s + Math.max(l.pend, 0), 0), stockT: C.lots.filter(l => okV(l.variedad_id)).reduce((s, l) => s + Math.max(l.disp, 0), 0), dias, semanas: Object.values(sem), mxe, porEt, peds, lots, movs };
}

};
const activeAdmins = () => S.personas.filter(p => p.activo && p.rol === 'admin');
async function crearUsuario() {
  if (ME()?.rol !== 'admin') return;
  const n = $('#nu_n').value.trim(), r = $('#nu_r').value, pin = $('#nu_p').value.trim();
  if (!n) return toast('Falta el nombre', true);
  if (S.personas.some(p => p.nombre.toLowerCase() === n.toLowerCase())) return toast('Ya existe un usuario con ese nombre', true);
  if (!/^\d{4}$/.test(pin)) return toast('El PIN tiene que ser de 4 números', true);
  await safe(async () => { const id = uid(); await DB.ins('personas', { id, nombre: n, rol: r, activo: true, pin_hash: await hashPin(id, pin) }); toast(`✅ ${n} creado como ${ROLES[r].label}`); render(); });
}
async function cambiarRol(id, r) {
  if (ME()?.rol !== 'admin') return;
  const p = S.personas.find(x => x.id === id);
  if (p.rol === 'admin' && r !== 'admin' && activeAdmins().length <= 1) { toast('Tiene que quedar al menos un administrador', true); return render(); }
  await safe(async () => { await DB.upd('personas', id, { rol: r }); toast(`${p.nombre} ahora es ${ROLES[r].label}`); render(); });
}
async function toggleUser(id) {
  if (ME()?.rol !== 'admin') return;
  const p = S.personas.find(x => x.id === id);
  if (p.id === ME().id) return toast('No podés desactivarte a vos', true);
  if (p.activo && p.rol === 'admin' && activeAdmins().length <= 1) return toast('Tiene que quedar al menos un administrador', true);
  await safe(async () => { await DB.upd('personas', id, { activo: !p.activo }); render(); });
}
function resetPin(id) {
  const p = S.personas.find(x => x.id === id);
  modal(`<h3>Nuevo PIN para <em>${esc(p.nombre)}</em></h3><div class="small muted">Reemplaza el anterior.</div>
  <label class="f">PIN (4 números)</label><input type="text" inputmode="numeric" maxlength="4" id="rp_p">
  <div class="row" style="margin-top:16px"><button class="btn" style="flex:1" onclick="guardarResetPin('${id}')">Guardar PIN</button><button class="btn sec" onclick="closeModal()">Cancelar</button></div>`);
}
async function guardarResetPin(id) {
  const pin = $('#rp_p').value.trim(); if (!/^\d{4}$/.test(pin)) return toast('El PIN tiene que ser de 4 números', true);
  await safe(async () => { await DB.upd('personas', id, { pin_hash: await hashPin(id, pin) }); closeModal(); toast('✅ PIN actualizado'); render(); });
}

/* ===================== datos de ejemplo (solo demo) ===================== */
function seedDemo() {
  if (LIVE) return;
  const b = demoBase(); b.variedades = S.variedades; b.motivos = S.motivos; b.personas = S.personas; b.config = S.config;
  const [vB, vI] = vAct(), t = today(), rnd = (a, z) => a + Math.floor(Math.random() * (z - a + 1)), mk = () => uid();
  const ts = (f, h) => f + 'T' + String(h).padStart(2, '0') + ':' + String(rnd(0, 59)).padStart(2, '0') + ':00';
  const pedidos = [], lotes = [], movs = [];
  const dias = []; for (let i = -14; i <= 0; i++) { const d = addDays(t, i); if (dow(d) !== 0) dias.push(d); }
  for (const d of dias) for (const [v, base] of [[vB, 60], [vI, 24]]) {
    const ped = base + rnd(-6, 6); pedidos.push({ id: mk(), fecha: d, variedad_id: v.id, cantidad: ped, responsable: 'Encargado de producción', anulado: false, created_at: ts(addDays(d, -1), 16) });
    if (d === t && new Date().getHours() < 10) continue;
    const prod = Math.max(0, ped + (Math.random() < .25 ? rnd(-10, 8) : rnd(-2, 2)));
    const L = { id: mk(), fecha: d, variedad_id: v.id, lote: loteNum(d), moldes: prod, motivo_desvio: Math.abs(prod - ped) / ped > .1 ? (prod < ped ? 'Faltó personal' : 'Ajuste a la demanda') : null, responsable: 'Encargado de producción', anulado: false, created_at: ts(d, 9) };
    lotes.push(L);
    let rest = prod; let f = addDays(d, Math.random() < .7 ? 1 : 2); if (dow(f) === 0) f = addDays(f, 1);
    if (Math.random() < .08) { const q = rnd(1, 3); rest -= q; movs.push({ id: mk(), tipo: 'descarte', etapa: 'pendiente', lote_id: L.id, fecha: f, moldes: q, paquetes: 0, motivo: 'Problema de cocción', responsable: 'Sandwichería', anulado: false, created_at: ts(f, 7) }); }
    while (rest > 0 && f <= t) {
      const c = Math.min(rest, Math.random() < .6 ? rest : rnd(Math.ceil(rest / 2), rest)), roto = Math.random() < .3 ? Math.min(c, rnd(1, 2)) : 0, ok = c - roto;
      if (ok) movs.push({ id: mk(), tipo: 'corte', etapa: 'corte', lote_id: L.id, fecha: f, moldes: ok, paquetes: Math.round(ok * v.rendimiento * (Math.random() < .2 ? .9 : 1)), responsable: 'Sandwichería', anulado: false, created_at: ts(f, 8) });
      if (roto) movs.push({ id: mk(), tipo: 'descarte', etapa: 'corte', lote_id: L.id, fecha: f, moldes: roto, paquetes: 0, motivo: 'Rotura durante el corte', responsable: 'Sandwichería', anulado: false, created_at: ts(f, 8) });
      rest -= c; f = addDays(f, 1); if (dow(f) === 0) f = addDays(f, 1);
    }
  }
  S = { ...b, pedidos, lotes, movs }; VER++;
  // despachos FIFO día a día
  for (const d of dias) for (const v of [vB, vI]) {
    const av = l => movs.filter(m => m.lote_id === l.id && m.fecha <= d).reduce((s, m) => s + (m.tipo === 'corte' ? m.paquetes : (m.tipo === 'despacho' || (m.tipo === 'descarte' && m.etapa === 'terminado')) ? -m.paquetes : 0), 0);
    const disp = calc().lots.filter(l => l.variedad_id === v.id).map(l => [l, av(l)]).filter(x => x[1] > 0);
    let q = Math.round(disp.reduce((s, x) => s + x[1], 0) * (d === t ? .3 : .85));
    for (const [l, a] of disp) { if (q <= 0) break; const x = Math.min(q, a); movs.push({ id: mk(), tipo: 'despacho', etapa: 'terminado', lote_id: l.id, fecha: d, moldes: 0, paquetes: x, destino: ['Camión 1', 'Camión 2', 'Camión 3'][rnd(0, 2)], grupo: d + v.id, responsable: 'Recepción', anulado: false, created_at: ts(d, 10) }); q -= x; }
    if (Math.random() < .2) { const l = calc().lots.find(l => l.variedad_id === v.id && av(l) >= 4); if (l) movs.push({ id: mk(), tipo: 'descarte', etapa: 'terminado', lote_id: l.id, fecha: d, moldes: 0, paquetes: rnd(1, 4), motivo: 'Devolución / sobrante', responsable: 'Recepción', anulado: false, created_at: ts(d, 18) }); }
    VER++;
  }
  demoSave(); VER++; toast('Datos de ejemplo cargados (2 semanas)'); go('inicio');
}

/* ===================== arranque ===================== */
let reloadT = null, pendingRefresh = false;
function scheduleReload() { clearTimeout(reloadT); reloadT = setTimeout(async () => { try { await DB.load(); if (!ME()) return render(); const a = document.activeElement; if (a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName) || $('#modal').innerHTML) { pendingRefresh = true; return; } render(); } catch (e) { console.error(e); } }, 600); }
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRefresh && !document.activeElement?.matches('input,select,textarea') && !$('#modal').innerHTML) { pendingRefresh = false; render(); } }, 300));

(async function init() {
  $('#mode').textContent = LIVE ? 'EN LÍNEA' : 'DEMO'; $('#mode').className = 'badge-mode' + (LIVE ? ' live' : '');
  try {
    if (LIVE) {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      await DB.load();
      sb.channel('pm').on('postgres_changes', { event: '*', schema: 'public' }, p => { if (p.table && p.table.startsWith('pm_')) scheduleReload(); }).subscribe();
      setInterval(scheduleReload, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleReload(); });
    } else await DB.load();
    render();

  } catch (e) {
    console.error(e);
    $('#view').innerHTML = `<div class="empty"><b>No se pudo conectar con la base de datos.</b><br><br>${esc(e.message || e)}<br><br>Revisá que se haya ejecutado el SQL en Supabase y que la key sea la anon legacy (eyJ...).<br><br><button class="btn" onclick="location.reload()">Reintentar</button></div>`;
  }
})();
</script>
